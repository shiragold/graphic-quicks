name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r build

      # The buildless apps import ../../packages/<tool>/dist/index.js, so the
      # published site must mirror the repo layout: apps/ + packages/*/dist.
      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a --exclude node_modules apps _site/
          for dist in packages/*/dist; do
            mkdir -p "_site/$(dirname "$dist")"
            rsync -a "$dist/" "_site/$dist/"
          done
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>graphic-quicks</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 4rem auto; padding: 0 1rem; }
              li { margin: 0.5rem 0; }
            </style>
          </head>
          <body>
            <h1>graphic-quicks</h1>
            <ul>
              <li><a href="apps/photo-edit/">Photo edit</a> — deskew and crop scanned photos</li>
              <li><a href="apps/photo-collage/photo-collage.html">Photo collage</a> — layout and export collages</li>
              <li><a href="apps/image-scale/">Image scale</a> — batch upscale images</li>
            </ul>
          </body>
          </html>
          HTML

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
