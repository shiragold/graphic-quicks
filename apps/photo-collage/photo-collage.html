<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Collage Maker</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .page-header,
      main {
        max-width: 1400px;
        margin-inline: auto;
        padding-inline: 32px;
      }
      .page-header {
        padding-block: 48px 0;
        text-align: center;
      }
      main {
        padding-block: 40px 48px;
      }

      h1 {
        font-size: 40px;
        margin: 0;
      }
      h2 {
        font-size: 26px;
        margin: 0;
        text-align: left;
      }

      .layout {
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 48px;
        align-items: start;
      }

      section {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 20px;
      }

      .left-col {
        min-width: 0;
      }
      .left-col__toggle {
        cursor: pointer;
        font-size: 16px;
        padding: 8px 0;
        margin-block-end: 24px;
      }
      .left-col:not([open]) .left-col__toggle {
        margin-block-end: 0;
      }
      .left-col__body {
        display: flex;
        flex-direction: column;
        gap: 40px;
      }

      .layout:has(.left-col:not([open])) {
        grid-template-columns: 1fr;
      }
      .layout:has(.left-col:not([open])) .col-right {
        grid-column: 1;
      }

      .col-right {
        min-width: 0;
        position: sticky;
        top: 24px;
      }

      .preview-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }

      photo-upload {
        font-size: 15px;
        --photo-upload-border-width: 0;
        --photo-upload-radius: 0;
        --photo-upload-padding: 48px 20px;
        --photo-upload-gap: 12px;
      }
      /* The original hint line was full-size, full-opacity text. */
      photo-upload::part(hint) {
        font-size: 1em;
        opacity: 1;
      }

      .thumbs {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
        gap: 8px;
        width: 100%;
      }
      .thumbs:empty {
        display: none;
      }

      #clearBtn {
        align-self: flex-start;
      }

      .thumb {
        position: relative;
        aspect-ratio: 1;
      }
      .thumb img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .thumb .remove {
        position: absolute;
        top: 4px;
        right: 4px;
      }
      .thumb .order {
        position: absolute;
        bottom: 4px;
        left: 4px;
        font-size: 12px;
        padding: 2px 6px;
      }

      form {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 20px;
        width: 100%;
      }

      .control-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-start;
        align-items: center;
        gap: 12px 16px;
        width: 100%;
        border: 0;
        padding: 0;
        margin: 0;
        min-inline-size: 0;
      }

      .field {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
      }
      .field input[type="number"] {
        width: 80px;
      }
      .field input[type="range"] {
        width: 140px;
      }

      .preset-btns {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: flex-start;
      }

      .preview-frame {
        width: 100%;
        max-height: 80vh;
        display: grid;
        place-items: center;
        border: 1px solid #ccc;
        margin: 0;
      }
      .preview-frame canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
      }
      .preview-placeholder {
        margin: 0;
        font-size: 16px;
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
          gap: 32px;
        }
        .col-right {
          position: static;
        }
      }

      @media (max-width: 640px) {
        .page-header,
        main {
          padding-inline: 16px;
        }
        .page-header {
          padding-block-start: 24px;
        }
        main {
          padding-block: 32px 24px;
        }
        h1 {
          font-size: 30px;
        }
        h2 {
          font-size: 22px;
        }
        photo-upload {
          --photo-upload-padding: 36px 16px;
        }
      }
    </style>
  </head>
  <body>
    <header class="page-header">
      <h1>Photo Collage Maker</h1>
    </header>

    <main class="layout">
      <details class="left-col" open>
        <summary class="left-col__toggle">Controls</summary>
        <div class="left-col__body">
        <section aria-labelledby="upload-heading">
          <h2 id="upload-heading">Add photos</h2>
          <photo-upload id="uploadArea" accept="image/*" multiple>
            <span slot="icon">+</span>
            <span slot="label"><strong>Drop photos here</strong> or click to browse</span>
            <span slot="hint">Any number of images. JPEG, PNG, WebP supported.</span>
          </photo-upload>
          <ul id="thumbs" class="thumbs" aria-label="Uploaded photos"></ul>
          <button id="clearBtn" type="button" disabled>Clear All</button>
        </section>

        <section aria-labelledby="settings-heading">
          <h2 id="settings-heading">Configure outcome</h2>
          <form>
            <fieldset class="control-row">
              <legend class="visually-hidden">Canvas size</legend>
              <label class="field">
                <span>Width</span>
                <input
                  type="number"
                  id="outWidth"
                  value="800"
                  min="100"
                  max="10000"
                  step="10"
                />
              </label>
              <label class="field">
                <span>Height</span>
                <input
                  type="number"
                  id="outHeight"
                  value="1200"
                  min="100"
                  max="10000"
                  step="10"
                />
              </label>
              <div
                class="preset-btns"
                role="group"
                aria-label="Aspect ratio presets"
              >
                <button type="button" data-w="800" data-h="1200">2:3</button>
                <button type="button" data-w="1200" data-h="800">3:2</button>
                <button type="button" data-w="1080" data-h="1080">1:1</button>
                <button type="button" data-w="1080" data-h="1920">9:16</button>
                <button type="button" data-w="1920" data-h="1080">16:9</button>
                <button type="button" data-w="1240" data-h="1748">A4</button>
              </div>
            </fieldset>

            <fieldset class="control-row">
              <legend class="visually-hidden">Layout options</legend>
              <label class="field">
                <span>Layout</span>
                <select id="layout">
                  <option value="justified-rows" selected>Auto rows</option>
                  <option value="justified-cols">Auto cols</option>
                  <option value="grid">Grid</option>
                  <option value="columns">Masonry</option>
                  <option value="hero-grid">Hero + grid</option>
                  <option value="mosaic">Mosaic</option>
                  <option value="polaroid">Polaroid scatter</option>
                  <option value="row">One row</option>
                  <option value="column">One column</option>
                </select>
              </label>
              <label class="field" id="columnsField">
                <span>Columns</span>
                <input
                  type="number"
                  id="columns"
                  value="2"
                  min="1"
                  max="10"
                  step="1"
                />
              </label>
              <label class="field" id="heroPosField">
                <span>Hero position</span>
                <select id="heroPos">
                  <option value="start">Start</option>
                  <option value="center" selected>Center</option>
                  <option value="end">End</option>
                </select>
              </label>
            </fieldset>

            <fieldset class="control-row">
              <legend class="visually-hidden">Appearance</legend>
              <label class="field">
                <span>Background</span>
                <input type="color" id="bgColor" value="#ffffff" />
              </label>
              <label class="field">
                <span>Gap</span>
                <input type="range" id="gap" min="0" max="60" value="8" />
                <output id="gapVal" for="gap">8</output>
              </label>
              <label class="field">
                <span>Corner radius</span>
                <input type="range" id="radius" min="0" max="60" value="0" />
                <output id="radiusVal" for="radius">0</output>
              </label>
            </fieldset>
          </form>
        </section>
        </div>
      </details>

      <section class="col-right" aria-labelledby="preview-heading">
        <header class="preview-header">
          <h2 id="preview-heading">See preview</h2>
          <button id="downloadBtn" type="button" disabled>
            Download Collage (PNG)
          </button>
        </header>
        <figure id="previewWrap" class="preview-frame">
          <canvas id="previewCanvas" aria-label="Collage preview"></canvas>
          <figcaption id="previewPlaceholder" class="preview-placeholder" role="status">
            Live preview
          </figcaption>
        </figure>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
