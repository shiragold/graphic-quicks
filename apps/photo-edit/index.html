<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto Crop</title>
<style>
  html { color-scheme: light; background: #fff; color: #111; }
  body { margin: 0; }
  .app { display: flex; height: 100vh; }
  .drawer { width: 320px; flex-shrink: 0; overflow: auto; padding: 8px; box-sizing: border-box; }
  .results { flex: 1; overflow: auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 8px; box-sizing: border-box; }
  .results figure { margin: 0; }
  .results figure canvas { width: 100%; height: auto; display: block; }
  #thumbnail-section figure { margin: 0; }
  #thumbnail { width: 100%; height: auto; display: block; }
  photo-upload {
    margin: 8px 0;
    --photo-upload-padding: 24px 12px;
    --photo-upload-icon-size: 28px;
    --photo-upload-radius: 8px;
    --photo-upload-border-color: #999;
    --photo-upload-border-color-active: #333;
    --photo-upload-background-active: rgba(0, 0, 0, 0.04);
  }
</style>
</head>
<body>
<main class="app">
  <aside class="drawer">
    <header><h1>Auto Crop</h1></header>

    <section aria-label="Configuration">
      <photo-upload id="upload" accept="image/*">
        <span slot="label"><strong>Drop a photo here</strong> or click to browse</span>
        <span slot="hint">One image at a time</span>
      </photo-upload>
    </section>

    <section aria-label="Status">
      <p id="status" role="status">Loading OpenCV.js…</p>
    </section>

    <section aria-label="Thumbnail" id="thumbnail-section" hidden>
      <figure>
        <figcaption>Uploaded photo</figcaption>
        <img id="thumbnail" alt="Uploaded photo thumbnail">
      </figure>
    </section>

    <section aria-label="Detection info">
      <dl id="detection-info">
        <dt>Angle</dt><dd id="info-angle">—</dd>
        <dt>Margin top</dt><dd id="info-margin-top">—</dd>
        <dt>Margin right</dt><dd id="info-margin-right">—</dd>
        <dt>Margin bottom</dt><dd id="info-margin-bottom">—</dd>
        <dt>Margin left</dt><dd id="info-margin-left">—</dd>
      </dl>
    </section>
  </aside>

  <section class="results" aria-label="Suggestions">
    <figure>
      <figcaption>Original <a id="dl-0" hidden download="original.png">Download</a></figcaption>
      <canvas id="canvas-0"></canvas>
    </figure>
    <figure>
      <figcaption>Tight crop <a id="dl-1" hidden download="tight.png">Download</a></figcaption>
      <canvas id="canvas-1"></canvas>
    </figure>
    <figure>
      <figcaption>Deskewed + tight <a id="dl-2" hidden download="deskewed-tight.png">Download</a></figcaption>
      <canvas id="canvas-2"></canvas>
    </figure>
    <figure>
      <figcaption>Deskewed + padded <a id="dl-3" hidden download="deskewed-padded.png">Download</a></figcaption>
      <canvas id="canvas-3"></canvas>
    </figure>
  </section>
</main>

<script type="module">
  import { processMat } from '../../packages/photo-edit/dist/index.js';
  import '../../packages/ui-photo-upload/dist/index.js';

  // OpenCV.js loader -----------------------------------------------------
  const statusEl = document.getElementById('status');
  let cvReady = false;
  let pendingFile = null;

  // Module-scope functions aren't attached to window in a `type="module"`
  // script, so publish the two callbacks referenced from HTML explicitly.
  window.Module = {
    onRuntimeInitialized() {
      cvReady = true;
      statusEl.textContent = 'Ready. Choose a photo.';
      if (pendingFile) { handleFile(pendingFile); pendingFile = null; }
    },
  };
  window.onCvLoadError = function onCvLoadError() {
    statusEl.textContent = 'Failed to load OpenCV.js. Check your connection and reload.';
    statusEl.setAttribute('role', 'alert');
  };

  // File handling --------------------------------------------------------
  document.getElementById('upload').addEventListener('photo-upload:files', (e) => {
    const file = e.detail.files[0];
    if (!file) return;
    if (!cvReady) { pendingFile = file; statusEl.textContent = 'Waiting for OpenCV.js to finish loading…'; return; }
    handleFile(file);
  });

  let lastThumbUrl = null;
  function setThumbnail(url) {
    const thumb = document.getElementById('thumbnail');
    const section = document.getElementById('thumbnail-section');
    if (lastThumbUrl) URL.revokeObjectURL(lastThumbUrl);
    lastThumbUrl = url;
    thumb.src = url;
    section.hidden = false;
  }

  function handleFile(file) {
    statusEl.textContent = 'Processing…';
    const url = URL.createObjectURL(file);
    setThumbnail(url);
    const img = new Image();
    img.onload = () => {
      try {
        runPipeline(img);
        statusEl.textContent = 'Done.';
      } catch (err) {
        console.error(err);
        statusEl.textContent = 'Error: ' + (err && err.message ? err.message : err);
        statusEl.setAttribute('role', 'alert');
      }
    };
    img.onerror = () => { statusEl.textContent = 'Failed to load image.'; };
    img.src = url;
  }

  // Pipeline (thin wrapper around processMat) ----------------------------
  function runPipeline(img) {
    const tmp = document.createElement('canvas');
    tmp.width = img.naturalWidth;
    tmp.height = img.naturalHeight;
    tmp.getContext('2d').drawImage(img, 0, 0);

    const src = cv.imread(tmp);
    try {
      const { theta, rotated, bboxRotated, bboxOriginal, margins } = processMat(src);
      try {
        updateInfo(theta, margins);

        // 1. Original
        drawMatToCanvas(src, 'canvas-0', 'dl-0');

        // 2. Tight crop only (no rotation)
        if (bboxOriginal) {
          const cropped = src.roi(bboxOriginal);
          drawMatToCanvas(cropped, 'canvas-1', 'dl-1');
          cropped.delete();
        } else {
          drawMatToCanvas(src, 'canvas-1', 'dl-1');
        }

        // 3. Deskewed + tight
        if (bboxRotated) {
          const cropped = rotated.roi(bboxRotated);
          drawMatToCanvas(cropped, 'canvas-2', 'dl-2');
          cropped.delete();
        } else {
          drawMatToCanvas(rotated, 'canvas-2', 'dl-2');
        }

        // 4. Deskewed + padded (~2% on each side)
        if (bboxRotated) {
          const padX = Math.round(bboxRotated.width * 0.02);
          const padY = Math.round(bboxRotated.height * 0.02);
          const px = Math.max(0, bboxRotated.x - padX);
          const py = Math.max(0, bboxRotated.y - padY);
          const pw = Math.min(rotated.cols - px, bboxRotated.width + 2 * padX);
          const ph = Math.min(rotated.rows - py, bboxRotated.height + 2 * padY);
          const padded = rotated.roi(new cv.Rect(px, py, pw, ph));
          drawMatToCanvas(padded, 'canvas-3', 'dl-3');
          padded.delete();
        } else {
          drawMatToCanvas(rotated, 'canvas-3', 'dl-3');
        }
      } finally {
        rotated.delete();
      }
    } finally {
      src.delete();
    }
  }

  // Rendering ------------------------------------------------------------
  function drawMatToCanvas(mat, canvasId, downloadId) {
    const canvas = document.getElementById(canvasId);
    cv.imshow(canvas, mat);
    const dl = document.getElementById(downloadId);
    if (dl) {
      dl.href = canvas.toDataURL('image/png');
      dl.hidden = false;
    }
  }

  function updateInfo(theta, margins) {
    document.getElementById('info-angle').textContent = theta.toFixed(2) + '°';
    if (margins) {
      document.getElementById('info-margin-top').textContent = margins.top + ' px';
      document.getElementById('info-margin-right').textContent = margins.right + ' px';
      document.getElementById('info-margin-bottom').textContent = margins.bottom + ' px';
      document.getElementById('info-margin-left').textContent = margins.left + ' px';
    } else {
      for (const id of ['info-margin-top', 'info-margin-right', 'info-margin-bottom', 'info-margin-left']) {
        document.getElementById(id).textContent = 'n/a';
      }
    }
  }
</script>
<script async src="https://docs.opencv.org/4.x/opencv.js" onerror="onCvLoadError()"></script>
</body>
</html>
