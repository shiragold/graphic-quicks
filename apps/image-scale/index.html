<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batch Image Upscaler</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        photo-upload {
            margin-bottom: 20px;
            --photo-upload-border-width: 3px;
            --photo-upload-border-style: dashed;
            --photo-upload-border-color: #667eea;
            --photo-upload-border-color-active: #764ba2;
            --photo-upload-background-active: #f8f9ff;
            --photo-upload-radius: 15px;
            --photo-upload-padding: 40px;
            --photo-upload-icon-size: 48px;
            --photo-upload-gap: 10px;
        }

        photo-upload[dragover] {
            --photo-upload-background-active: #f0f2ff;
        }

        photo-upload .upload-hint {
            font-size: 12px;
            color: #999;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        label {
            font-weight: 600;
            color: #333;
        }

        select {
            flex: 1;
            min-width: 150px;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .button-secondary {
            background: #6c757d;
        }

        .button-success {
            background: #28a745;
        }

        .stats {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #555;
            display: none;
        }

        .stats.active {
            display: block;
        }

        .progress-container {
            display: none;
            margin-bottom: 20px;
        }

        .progress-container.active {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 12px;
        }

        .images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .image-card {
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 15px;
            background: #fafafa;
            position: relative;
        }

        .image-card.processing {
            opacity: 0.6;
        }

        .image-card.completed {
            border-color: #28a745;
        }

        .image-preview {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
            background: #e0e0e0;
        }

        .image-info {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }

        .image-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .image-status {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 5px;
        }

        .status-pending {
            background: #ffc107;
            color: #000;
        }

        .status-processing {
            background: #17a2b8;
            color: white;
        }

        .status-completed {
            background: #28a745;
            color: white;
        }

        .status-error {
            background: #dc3545;
            color: white;
        }

        .image-card.error {
            border-color: #dc3545;
        }

        .image-error {
            font-size: 11px;
            color: #dc3545;
            margin-top: 5px;
        }

        .remove-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #dc3545;
            color: white;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            padding: 0;
        }

        .remove-btn:hover {
            background: #c82333;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .action-buttons button {
            flex: 1;
            min-width: 150px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            select, button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖼️ Batch Image Upscaler</h1>
        <p class="subtitle">Upload and upscale multiple images at once</p>

        <photo-upload accept="image/*" multiple>
            <span slot="icon">📁</span>
            <span slot="label"><strong>Click to upload</strong> or drag and drop</span>
            <span slot="hint" class="upload-hint">Select multiple images (PNG, JPG, WEBP)</span>
        </photo-upload>

        <div class="controls">
            <label for="scaleSelect">Upscale Factor:</label>
            <select id="scaleSelect"></select>
        </div>

        <div class="stats" id="stats"></div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill">0%</div>
            </div>
        </div>

        <div id="imagesContainer">
            <div class="empty-state" id="emptyState">
                No images uploaded yet. Upload some images to get started!
            </div>
            <div class="images-grid" id="imagesGrid"></div>
        </div>

        <div class="action-buttons" id="actionButtons" style="display: none;">
            <button id="upscaleAllBtn">Upscale All Images</button>
            <button id="downloadAllBtn" class="button-success" style="display: none;">Download All</button>
            <button id="clearAllBtn" class="button-secondary">Clear All</button>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
